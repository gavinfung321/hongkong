<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Victoria Harbour Asset Contact Sheet</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #0a1019; color: #edf3fb; }
    header { max-width: 1100px; margin: 0 auto 28px; }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 44px); }
    p { margin: 0; color: #aeb9c7; line-height: 1.5; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .tag { padding: 5px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .direct { background: #153d31; color: #9ff0c7; }
    .conditional { background: #493a14; color: #ffe299; }
    .reference { background: #35263f; color: #e4bef4; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; max-width: 1600px; margin: auto; }
    article { overflow: hidden; border: 1px solid #253144; border-radius: 14px; background: #111a27; }
    .meta { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 14px; }
    h2 { margin: 0 0 5px; font-size: 16px; overflow-wrap: anywhere; }
    small { color: #8e9bad; }
    .samples { display: grid; grid-template-columns: 1fr 1fr; min-height: 210px; }
    .sample { position: relative; display: grid; place-items: center; padding: 12px; overflow: hidden; }
    .sample::after { position: absolute; right: 7px; bottom: 5px; font-size: 10px; letter-spacing: .08em; opacity: .65; }
    .sample.dark { background: linear-gradient(145deg, #03060b, #14263a); }
    .sample.dark::after { content: "DARK"; color: white; }
    .sample.light { background: linear-gradient(145deg, #fff, #cdd8e4); }
    .sample.light::after { content: "LIGHT"; color: #102033; }
    img { display: block; max-width: 100%; max-height: 230px; object-fit: contain; }
  </style>
</head>
<body>
  <header>
    <h1>Victoria Harbour asset contact sheet</h1>
    <p>Optimized staging candidates shown against dark and light backgrounds. These files are not yet integrated into the website.</p>
    <div class="legend">
      <span class="tag direct">Direct-use candidate</span>
      <span class="tag conditional">Conditional</span>
      <span class="tag reference">Reference / fallback</span>
    </div>
  </header>
  <main id="assets"></main>
  <script>
    const assets = [
      ['bauhinia-petal.webp', 'Direct-use', 'direct', '512×500 · 29 KB'],
      ['harbour-spray.webp', 'Direct-use', 'direct', '1600×534 · 178 KB'],
      ['coral-clouds.webp', 'Direct-use', 'direct', '1600×534 · 251 KB'],
      ['harbour-mist.webp', 'Direct-use', 'direct', '1600×534 · 220 KB'],
      ['firework-burst.webp', 'Direct-use', 'direct', '768×692 · 253 KB'],
      ['firework-smoke.webp', 'Direct-use', 'direct', '1600×800 · 382 KB'],
      ['firework-embers.webp', 'Direct-use', 'direct', '1024×682 · 87 KB'],
      ['bauhinia-flower-cluster.webp', 'Conditional', 'conditional', '892×1024 · 208 KB'],
      ['bauhinia-tree.webp', 'Conditional', 'conditional', '1280×1088 · 409 KB'],
      ['bauhinia-trunk-branches.webp', 'Conditional', 'conditional', '1280×1088 · 361 KB'],
      ['wet-paving.webp', 'Conditional', 'conditional', '1600×532 · 125 KB'],
      ['ferry-bow-fragment.webp', 'Conditional', 'conditional', '1280×1024 · 239 KB'],
      ['promenade-railing.webp', 'Reference', 'reference', '1600×678 · 117 KB'],
      ['promenade-lamp.webp', 'Reference', 'reference', '854×1280 · 63 KB'],
      ['water-reflections.webp', 'Reference', 'reference', '1600×800 · 396 KB']
    ];
    const root = 'references/production-candidates/';
    document.querySelector('#assets').innerHTML = assets.map(([file, status, kind, details]) => `
      <article>
        <div class="meta">
          <div><h2>${file}</h2><small>${details}</small></div>
          <span class="tag ${kind}">${status}</span>
        </div>
        <div class="samples">
          <div class="sample dark"><img src="${root}${file}" alt="${file} on dark background"></div>
          <div class="sample light"><img src="${root}${file}" alt="${file} on light background"></div>
        </div>
      </article>`).join('');
  </script>
</body>
</html>
